name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::styler
          needs: lint

      - name: Check style (styler)
        run: |
          fails <- styler::style_pkg(dry = "fail")
          if (any(fails$changed)) {
            message("Files with style issues:")
            message(paste(fails$file[fails$changed], collapse = "\n"))
            quit(status = 1)
          }
        shell: Rscript {0}

      - name: Lint (lintr)
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
